server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 허용 목록 방식: 컨테이너가 저장소 폴더 전체를 웹 루트로 올리므로(CLAUDE.md·nginx 설정·README가
    # 그대로 받아졌다) 계산기에 필요한 파일만 열고 나머지는 전부 404.
    root /usr/share/nginx/html;

    location = / {
        index index.html;
    }

    location = /index.html { }
    location = /copay-calculator.html { }
    location ^~ /assets/ { }

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
